configuration:
  mode:
    name: Mode
    description: >-
      "printer_app": CUPS 3 style using the Legacy Printer Application
      (recommended). "cups": classic CUPS server as a fallback.
  auth:
    name: Login
    description: >-
      Login for web administration. "homeassistant": with a Home Assistant
      user account. "manual": with the username and password below.
  admin_username:
    name: Admin username
    description: >-
      Only for login "manual". Default: print.
  admin_password:
    name: Admin password
    description: >-
      Only for login "manual". Leave empty to generate a random password,
      which is then shown in the add-on log.
  auto_setup:
    name: Automatic setup
    description: >-
      Automatically adds the Brother MFC-260C as soon as it is connected via
      USB and switched on, also while the add-on is running ("printer_app"
      mode only). Once a printer is set up, USB monitoring stops until the
      next add-on start.
  scanner:
    name: Scanner
    description: >-
      Provide the scanner via AirScan/eSCL (macOS, Windows, Android/Mopria,
      Linux) and scan from the Home Assistant sidebar.
  scan_button:
    name: Scan button on the device (experimental)
    description: >-
      The "Scan" menu on the MFC-260C scans straight into the scan folder
      ("File" with the settings below, "Image" as color JPEG). Requires the
      Brother scan-key-tool, see documentation.
  scan_folder:
    name: Scan folder
    description: Target folder for button scans (below /share or /media).
  scan_format:
    name: Scan format
    description: File format for button scans.
  scan_resolution:
    name: Scan resolution
    description: Resolution in dpi for button scans.
  scan_mode:
    name: Scan color mode
    description: Color or grayscale for button scans.
  scan_source:
    name: Scan source
    description: >-
      Flatbed or automatic document feeder (adf) for button scans.
  print_folder:
    name: Print folder
    description: >-
      Files (PDF, PostScript, JPEG, PNG) placed in the print folder are
      printed automatically and then moved to "gedruckt/".
  print_folder_path:
    name: Print folder path
    description: Folder below /share or /media, e.g. /share/print.
  log_level:
    name: Log level
    description: >-
      Log verbosity. "info" shows add-on messages and warnings; "debug"
      additionally shows every printer connection and the Brother driver's
      debug log.
