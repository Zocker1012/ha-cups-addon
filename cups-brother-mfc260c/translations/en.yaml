configuration:
  printer:
    name: Printer
    description: Print server and automatic setup.
    fields:
      mode:
        name: Mode
        description: >-
          "printer_app" (recommended, CUPS 3 style) or "cups" (classic CUPS
          server as a fallback).
      auto_setup:
        name: Automatic setup
        description: >-
          Add the printer as soon as it is connected via USB and switched on
          ("printer_app" only).
  login:
    name: Login
    description: Who may use the printer administration in the browser.
    fields:
      method:
        name: Method
        description: >-
          "homeassistant": with a HA user account. "manual": with the username
          and password from here.
      username:
        name: Username
        description: Only for "manual" in "cups" mode. Empty = print.
      password:
        name: Password
        description: >-
          Only for "manual". Empty = random password, shown in the log.
  scanning:
    name: Scanner
    description: Scanning via AirScan/eSCL (Windows, macOS, Android, Linux, HA).
    fields:
      enabled:
        name: Provide scanner
      max_resolution:
        name: Maximum resolution (dpi)
        description: >-
          600 = the device's real resolution. 1200 is interpolated and very
          slow.
  scan_menu:
    name: Scan menu on the device
    description: The "Scan" menu on the MFC-260C saves directly to a folder.
    fields:
      enabled:
        name: Use scan menu
      folder:
        name: Folder
        description: Below /share or /media.
      format:
        name: Format
        description: For "File", "OCR" and "E-mail". "Image" is always JPEG.
      resolution:
        name: Resolution (dpi)
      color:
        name: Color
        description: '"color" or "gray" for "File", "OCR" and "E-mail".'
      image_color:
        name: Color for "Image"
        description: Color for the "Image" menu item.
  folder_printing:
    name: Print folder
    description: Files placed in this folder are printed automatically.
    fields:
      enabled:
        name: Use print folder
      path:
        name: Folder
        description: >-
          Below /share or /media. PDF, PostScript, JPEG, PNG; moved to
          "gedruckt/" afterwards.
      paper:
        name: Paper size
        description: Default A4. Photo sizes in cm (10x15, 13x18, 9x13).
      color:
        name: Color
        description: '"gray" prints with black ink only.'
      quality:
        name: Quality
        description: '"draft" saves ink, "fine" is slower.'
  log_level:
    name: Log level
    description: >-
      "info" for everyday use, "debug" for troubleshooting (very verbose).
