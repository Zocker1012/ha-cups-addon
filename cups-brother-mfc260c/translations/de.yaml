configuration:
  printer:
    name: Drucker
    description: Druckserver und automatische Einrichtung.
    fields:
      mode:
        name: Modus
        description: >-
          "printer_app" (empfohlen, CUPS-3-Weg) oder "cups" (klassischer
          CUPS-Server als Rückfallebene).
      auto_setup:
        name: Automatisch einrichten
        description: >-
          Drucker anlegen, sobald er per USB verbunden und eingeschaltet ist
          (nur "printer_app").
  login:
    name: Anmeldung
    description: Wer die Druckerverwaltung im Browser bedienen darf.
    fields:
      method:
        name: Art
        description: >-
          "homeassistant": mit einem HA-Benutzerkonto. "manual": mit
          Benutzername und Passwort von hier.
      username:
        name: Benutzername
        description: Nur bei "manual" im Modus "cups". Leer = print.
      password:
        name: Passwort
        description: >-
          Nur bei "manual". Leer = zufälliges Passwort, steht dann im Log.
  scanning:
    name: Scanner
    description: Scannen per AirScan/eSCL (Windows, macOS, Android, Linux, HA).
    fields:
      enabled:
        name: Scanner bereitstellen
      max_resolution:
        name: Höchste Auflösung (dpi)
        description: >-
          600 = echte Auflösung des Geräts. 1200 ist hochgerechnet und sehr
          langsam.
  scan_menu:
    name: Scan-Menü am Gerät
    description: >-
      Menü "Scan" am MFC-260C speichert direkt in einen Ordner. Jeder
      Menüpunkt hat eigene Einstellungen.
    fields:
      enabled:
        name: Scan-Menü nutzen
      folder:
        name: Ordner
        description: Unter /share oder /media.
      format:
        name: Datei – Format
      resolution:
        name: Datei – Auflösung (dpi)
      color:
        name: Datei – Farbe
      image_format:
        name: Bild – Format
      image_resolution:
        name: Bild – Auflösung (dpi)
      image_color:
        name: Bild – Farbe
      ocr_format:
        name: Text – Format
      ocr_resolution:
        name: Text – Auflösung (dpi)
      ocr_color:
        name: Text – Farbe
      ocr_text:
        name: Text – Texterkennung
        description: >-
          Erkennt den Text: PDF wird durchsuchbar, bei JPEG/PNG kommt eine
          .txt-Datei dazu. Aus = normaler Scan.
      ocr_language:
        name: Text – Sprache
        description: '"deu_eng" = Deutsch und Englisch.'
      ocr_rotate:
        name: Text – Seiten automatisch drehen
        description: Dreht verkehrt herum oder quer liegende Seiten (PDF, JPEG).
      email_format:
        name: E-Mail – Format
      email_resolution:
        name: E-Mail – Auflösung (dpi)
      email_color:
        name: E-Mail – Farbe
  folder_printing:
    name: Druckordner
    description: Dateien in diesem Ordner werden automatisch gedruckt.
    fields:
      enabled:
        name: Druckordner nutzen
      path:
        name: Ordner
        description: >-
          Unter /share oder /media. PDF, PostScript, JPEG, PNG; danach nach
          "gedruckt/" verschoben.
      paper:
        name: Papierformat
        description: Standard A4. Fotoformate in cm (10x15, 13x18, 9x13).
      color:
        name: Farbe
        description: '"gray" druckt nur mit schwarzer Tinte.'
      quality:
        name: Qualität
        description: '"draft" spart Tinte, "fine" ist langsamer.'
  log_level:
    name: Log-Level
    description: >-
      "info" für den Alltag, "debug" zur Fehlersuche (sehr ausführlich).
