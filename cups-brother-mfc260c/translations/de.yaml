configuration:
  printer:
    name: Drucker
    description: Druckserver und automatische Einrichtung.
    fields:
      mode:
        name: Modus
        description: >-
          printer_app = empfohlen (CUPS-3-Weg). cups = klassischer CUPS-Server,
          nur falls printer_app Probleme macht.
      auto_setup:
        name: Automatisch einrichten
        description: >-
          An: Der Drucker wird angelegt, sobald er per USB verbunden und
          eingeschaltet ist (Papier A4). Aus: in der Weboberfläche selbst
          anlegen. Nur Modus printer_app.
  login:
    name: Anmeldung
    description: Wer die Druckerverwaltung im Browser bedienen darf.
    fields:
      method:
        name: Art
        description: >-
          homeassistant = mit einem HA-Konto (bei printer_app nur über die
          HA-Seitenleiste). manual = mit Benutzername und Passwort von hier.
      username:
        name: Benutzername
        description: Nur bei manual im Modus cups. Leer = print.
      password:
        name: Passwort
        description: Nur bei manual. Leer = zufälliges Passwort, steht im Log.
  scanning:
    name: Scanner
    description: Scannen im Netzwerk (Windows, macOS, Android, Linux, HA).
    fields:
      enabled:
        name: Scanner bereitstellen
        description: >-
          An: Scannen per PC, Handy und HA-Seitenleiste. Aus: Scanner ganz
          abgeschaltet, auch das Scan-Menü am Gerät.
      max_resolution:
        name: Höchste Auflösung (dpi)
        description: >-
          Grenze für alle Programme. 600 = echte Auflösung des Geräts, 1200 =
          hochgerechnet und sehr langsam.
  scan_menu:
    name: Scan-Menü am Gerät
    description: Taste „Scan“ am MFC-260C, Ziele Datei, Bild, Text, E-Mail.
    fields:
      enabled:
        name: Scan-Menü nutzen
        description: >-
          An: Ein Scan über das Menü „Scan“ am Gerät landet im Ordner unten.
          Aus: Das Gerät bleibt nach der Auswahl bei „PC-Anschluss“ stehen.
      folder:
        name: Ordner
        description: Ziel für alle Menüpunkte, unter /share oder /media.
      language:
        name: Texterkennung – Sprache
        description: Für alle Menüpunkte mit Texterkennung. deu_eng = Deutsch und Englisch.
      rotate:
        name: Texterkennung – Seiten automatisch drehen
        description: >-
          An: Verkehrt herum oder quer eingelegte Seiten werden vor der
          Texterkennung gerade gedreht (verlustfrei).
  scan_file:
    name: "Scan-Menü: Datei"
    description: Einstellungen für den Menüpunkt „Datei“.
    fields:
      format:
        name: Format
        description: pdf, jpeg oder png.
      resolution:
        name: Auflösung (dpi)
        description: 300 reicht für Dokumente, 600 ist das Maximum des Geräts.
      color:
        name: Farbe
        description: color = Farbe, gray = Graustufen (kleinere Datei).
      ocr:
        name: Texterkennung
        description: >-
          An: PDF wird durchsuchbar bzw. eine .txt-Datei kommt dazu, die
          Bildqualität ändert sich nicht. Ein paar Sekunden je Seite.
      compress:
        name: Verkleinern (aus = beste Qualität)
        description: >-
          Aus: beste Qualität – PDF verlustfrei (wie PNG, Farbseite ca. 9 MB),
          JPEG Qualität 90. An: Seiten als JPEG Qualität 75 – PDF ca. 1 MB,
          JPEG etwa ein Drittel kleiner, ideal für Dokumente. Bei png ohne
          Wirkung (immer verlustfrei).
  scan_image:
    name: "Scan-Menü: Bild"
    description: Einstellungen für den Menüpunkt „Bild“.
    fields:
      format:
        name: Format
        description: pdf, jpeg oder png.
      resolution:
        name: Auflösung (dpi)
        description: 300 reicht für Dokumente, 600 ist das Maximum des Geräts.
      color:
        name: Farbe
        description: color = Farbe, gray = Graustufen (kleinere Datei).
      compress:
        name: Verkleinern (aus = beste Qualität)
        description: >-
          Aus: beste Qualität – PDF verlustfrei (wie PNG, Farbseite ca. 9 MB),
          JPEG Qualität 90. An: Seiten als JPEG Qualität 75 – PDF ca. 1 MB,
          JPEG etwa ein Drittel kleiner, ideal für Dokumente. Bei png ohne
          Wirkung (immer verlustfrei).
  scan_text:
    name: "Scan-Menü: Text"
    description: Menüpunkt „Text“ – mit Texterkennung.
    fields:
      format:
        name: Format
        description: pdf, jpeg oder png.
      resolution:
        name: Auflösung (dpi)
        description: 300 reicht für Dokumente, 600 ist das Maximum des Geräts.
      color:
        name: Farbe
        description: color = Farbe, gray = Graustufen (kleinere Datei).
      ocr:
        name: Texterkennung
        description: >-
          An: Der Text wird erkannt – ein PDF bekommt eine unsichtbare
          Textebene (durchsuchbar), bei jpeg/png kommt eine .txt-Datei dazu.
          Die Bildqualität ändert sich nicht. Ein paar Sekunden je Seite.
      compress:
        name: Verkleinern (aus = beste Qualität)
        description: >-
          Aus: beste Qualität – PDF verlustfrei (wie PNG, Farbseite ca. 9 MB),
          JPEG Qualität 90. An: Seiten als JPEG Qualität 75 – PDF ca. 1 MB,
          JPEG etwa ein Drittel kleiner, ideal für Dokumente. Bei png ohne
          Wirkung (immer verlustfrei).
  scan_email:
    name: "Scan-Menü: E-Mail"
    description: Menüpunkt „E-Mail“ – speichert nur im Ordner, verschickt keine Mail.
    fields:
      format:
        name: Format
        description: pdf, jpeg oder png.
      resolution:
        name: Auflösung (dpi)
        description: 300 reicht für Dokumente, 600 ist das Maximum des Geräts.
      color:
        name: Farbe
        description: color = Farbe, gray = Graustufen (kleinere Datei).
      ocr:
        name: Texterkennung
        description: >-
          An: PDF wird durchsuchbar bzw. eine .txt-Datei kommt dazu, die
          Bildqualität ändert sich nicht. Ein paar Sekunden je Seite.
      compress:
        name: Verkleinern (aus = beste Qualität)
        description: >-
          Aus: beste Qualität – PDF verlustfrei (wie PNG, Farbseite ca. 9 MB),
          JPEG Qualität 90. An: Seiten als JPEG Qualität 75 – PDF ca. 1 MB,
          JPEG etwa ein Drittel kleiner, ideal für Dokumente. Bei png ohne
          Wirkung (immer verlustfrei).
  folder_printing:
    name: Druckordner
    description: Dateien in diesem Ordner werden automatisch gedruckt.
    fields:
      enabled:
        name: Druckordner nutzen
        description: >-
          An: Jede Datei (PDF, PostScript, JPEG, PNG) im Ordner wird gedruckt
          und danach nach „gedruckt/“ verschoben, Fehler nach „fehler/“.
      path:
        name: Ordner
        description: Unter /share oder /media.
      paper:
        name: Papierformat
        description: Standard a4. Fotoformate in cm (10x15, 13x18, 9x13).
      color:
        name: Farbe
        description: color = Farbe, gray = nur schwarze Tinte.
      quality:
        name: Qualität
        description: draft spart Tinte, fine ist langsamer.
  log_level:
    name: Log-Level
    description: info für den Alltag, debug zur Fehlersuche (sehr ausführlich).
