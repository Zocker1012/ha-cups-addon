name: "CUPS Addon (Brother MFC-260C)"
version: "2.1.0"
slug: cups-brother-mfc260c
description: >
  Druckserver für den Brother MFC-260C mit AirPrint/IPP Everywhere –
  wahlweise im CUPS-3-Stil (Legacy Printer Application) oder mit klassischem CUPS.

url: "https://github.com/Zocker1012/ha-cups-addon"

arch:
  - amd64

startup: services
boot: auto
init: false

# Netzwerk: nötig für mDNS/AirPrint und IPP auf Port 631
host_network: true

webui: "http://[HOST]:[PORT:631]/"

# Web-Oberfläche in der HA-Seitenleiste
ingress: true
ingress_port: 0
panel_icon: mdi:printer
panel_title: Drucker

# USB-Zugriff auf den Drucker
usb: true

# Anmeldung mit Home-Assistant-Benutzerkonten (Option auth: homeassistant)
auth_api: true

options:
  mode: printer_app
  auth: homeassistant
  auto_setup: true
  log_level: info

schema:
  mode: list(printer_app|cups)
  auth: list(homeassistant|manual)
  admin_username: str?
  admin_password: password?
  auto_setup: bool
  log_level: list(debug|info|warning|error)
