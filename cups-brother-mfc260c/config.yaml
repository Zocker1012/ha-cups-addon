name: "CUPS Addon (Brother MFC-260C)"
version: "2.5.0"
slug: cups-brother-mfc260c
description: >
  Druck- und Scanserver für den Brother MFC-260C: Drucken per AirPrint/IPP
  Everywhere (CUPS-3-Stil oder klassisches CUPS), Scannen per AirScan/eSCL.

url: "https://github.com/Zocker1012/ha-cups-addon"

arch:
  - amd64

startup: services
boot: auto
init: false

# Netzwerk: nötig für mDNS/AirPrint und IPP auf Port 631
host_network: true

webui: "http://[HOST]:[PORT:631]/"

# Supervisor-Watchdog: Add-on neu starten, wenn Port 631 nicht mehr antwortet
watchdog: "tcp://[HOST]:[PORT:631]"

# Web-Oberfläche in der HA-Seitenleiste
ingress: true
ingress_port: 0
panel_icon: mdi:printer
panel_title: Drucker

# USB-Zugriff auf den Drucker
usb: true

# Anmeldung mit Home-Assistant-Benutzerkonten (Option auth: homeassistant)
auth_api: true

# Ereignis "cups_addon_scan" an Home Assistant nach einem Scan per Taste
homeassistant_api: true

# Druck- und Scanordner
map:
  - share:rw
  - media:rw

# Optionen in Gruppen (in HA aufklappbar). Die Gruppen heißen bewusst anders
# als die Optionen bis 2.4.x (z. B. "scanner"), damit alte gespeicherte Werte
# den Start nicht blockieren – init.sh übernimmt sie einmalig.
# Neue Felder in einer Gruppe immer optional ("?") anlegen: Gespeicherte
# Gruppen ersetzen die Standardwerte komplett.
options:
  printer:
    mode: printer_app
    auto_setup: true
  login:
    method: homeassistant
  scanning:
    enabled: true
    max_resolution: "600"
  scan_menu:
    enabled: false
    folder: /share/scans
    format: pdf
    resolution: "300"
    color: color
  folder_printing:
    enabled: false
    path: /share/print
  log_level: info

schema:
  printer:
    mode: list(printer_app|cups)
    auto_setup: bool
  login:
    method: list(homeassistant|manual)
    username: str?
    password: password?
  scanning:
    enabled: bool
    max_resolution: list(600|1200)
  scan_menu:
    enabled: bool
    folder: match(^/(share|media)(/.*)?$)
    format: list(pdf|jpeg|png)
    resolution: list(100|150|200|300|600)
    color: list(color|gray)
  folder_printing:
    enabled: bool
    path: match(^/(share|media)(/.*)?$)
  log_level: list(debug|info|warning|error)
