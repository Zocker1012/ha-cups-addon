name: "CUPS Addon (Brother MFC-260C)"
version: "2.3.1"
slug: cups-brother-mfc260c
description: >
  Druck- und Scanserver für den Brother MFC-260C: Drucken per AirPrint/IPP
  Everywhere (CUPS-3-Stil oder klassisches CUPS), Scannen per AirScan/eSCL.

url: "https://github.com/Zocker1012/ha-cups-addon"

arch:
  - amd64

startup: services
boot: auto
init: false

# Netzwerk: nötig für mDNS/AirPrint und IPP auf Port 631
host_network: true

webui: "http://[HOST]:[PORT:631]/"

# Supervisor-Watchdog: Add-on neu starten, wenn Port 631 nicht mehr antwortet
watchdog: "tcp://[HOST]:[PORT:631]"

# Web-Oberfläche in der HA-Seitenleiste
ingress: true
ingress_port: 0
panel_icon: mdi:printer
panel_title: Drucker

# USB-Zugriff auf den Drucker
usb: true

# Anmeldung mit Home-Assistant-Benutzerkonten (Option auth: homeassistant)
auth_api: true

# Ereignis "cups_addon_scan" an Home Assistant nach einem Scan per Taste
homeassistant_api: true

# Druck- und Scanordner
map:
  - share:rw
  - media:rw

options:
  mode: printer_app
  auth: homeassistant
  auto_setup: true
  scanner: true
  scan_button: false
  scan_folder: /share/scans
  scan_format: pdf
  scan_resolution: "300"
  scan_mode: color
  scan_source: flatbed
  print_folder: false
  print_folder_path: /share/print
  log_level: info

schema:
  mode: list(printer_app|cups)
  auth: list(homeassistant|manual)
  admin_username: str?
  admin_password: password?
  auto_setup: bool
  scanner: bool
  scan_button: bool
  scan_folder: match(^/(share|media)(/.*)?$)
  scan_format: list(pdf|jpeg|png)
  scan_resolution: list(100|150|200|300|600)
  scan_mode: list(color|gray)
  scan_source: list(flatbed|adf)
  print_folder: bool
  print_folder_path: match(^/(share|media)(/.*)?$)
  log_level: list(debug|info|warning|error)
