# CUPS-Konfiguration für das Home-Assistant-Add-on (Modus "cups")
# Wird bei jedem Start nach /data/cups/cupsd.conf kopiert – Änderungen
# bitte hier im Image vornehmen. Dokumentation: man cupsd.conf

# Wird beim Start aus der Option "log_level" gesetzt
LogLevel warn
PageLogFormat
MaxLogSize 0

# Fehlerbehandlung bei Druckerproblemen
ErrorPolicy retry-job

# Netzwerk
Port 631
Listen /run/cups/cups.sock

# Drucker im Netzwerk bekanntmachen (AirPrint/IPP Everywhere)
Browsing Yes
BrowseLocalProtocols dnssd
DefaultShared Yes

# Authentifizierung (Benutzer "print", Passwort aus der Add-on-Option)
DefaultAuthType Basic

WebInterface Yes

# Zugriff über beliebige Hostnamen/IPs und den Ingress-Proxy erlauben
ServerAlias *

<Location />
  Order allow,deny
  Allow all
</Location>

<Location /admin>
  Order allow,deny
  Allow all
</Location>

<Location /admin/conf>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow all
</Location>

<Location /admin/log>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow all
</Location>

<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order deny,allow
  </Limit>

  <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Cancel-My-Jobs Close-Job CUPS-Move-Job CUPS-Get-Document>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit Cancel-Job CUPS-Authenticate-Job>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
