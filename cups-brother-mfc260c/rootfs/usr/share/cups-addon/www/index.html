<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brother MFC-260C</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #59636e;
      --accent: #03a9f4;
      --border: #d8dee4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111318;
        --card: #1c1f26;
        --text: #e6e8eb;
        --muted: #9aa4b0;
        --border: #2d333b;
      }
    }
    body {
      margin: 0;
      padding: 32px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    p.sub { margin: 0 0 24px; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    a.card {
      display: block;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      color: inherit;
      text-decoration: none;
    }
    a.card:hover { border-color: var(--accent); }
    .icon { font-size: 2rem; line-height: 1; }
    h2 { font-size: 1.1rem; margin: 12px 0 4px; }
    a.card p { margin: 0; color: var(--muted); font-size: 0.95rem; }
  </style>
</head>
<body>
  <main>
    <h1>Brother MFC-260C</h1>
    <p class="sub">Drucken und Scannen über Home Assistant</p>
    <div class="grid">
      <a class="card" href="printer/">
        <div class="icon" aria-hidden="true">🖨️</div>
        <h2>Drucker</h2>
        <p>Druckaufträge, Einstellungen und Verwaltung</p>
      </a>
      <a class="card" href="scan/">
        <div class="icon" aria-hidden="true">📄</div>
        <h2>Scanner</h2>
        <p>Dokument scannen und im Browser herunterladen</p>
      </a>
    </div>
  </main>
</body>
</html>
