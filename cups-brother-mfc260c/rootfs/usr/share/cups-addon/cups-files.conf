# CUPS-Dateikonfiguration für das Home-Assistant-Add-on (Modus "cups")
# Wird bei jedem Start nach /data/cups/cups-files.conf kopiert.

SystemGroup root lpadmin
PeerCred on

# Logs ins Add-on-Log von Home Assistant
AccessLog stderr
ErrorLog stderr
PageLog stderr
