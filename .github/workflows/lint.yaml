# Prüft Skripte, YAML-Dateien und Dockerfile bei jeder Änderung – dieselben
# Prüfungen, die vor jedem Commit von Hand laufen. Dauert unter einer Minute.
name: Prüfung

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  ADDON: cups-brother-mfc260c

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Prüfprogramme installieren
        run: pip install --quiet shellcheck-py==0.11.0.1 yamllint==1.38.0

      - name: Skripte (shellcheck)
        run: |
          mapfile -t files < <(grep -rlE '^#!.*(bash|bashio)' "${ADDON}/rootfs")
          printf '%s\n' "${files[@]}"
          shellcheck -x -P "${ADDON}/rootfs/etc/s6-overlay/scripts" "${files[@]}"

      - name: YAML (yamllint)
        run: yamllint "${ADDON}/config.yaml" "${ADDON}/translations" .github/workflows

      - name: Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < "${ADDON}/Dockerfile"
